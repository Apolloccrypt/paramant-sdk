name: release

# Publishes paramant-sdk to PyPI and npm when a GitHub Release is published.
# Tag the release "v<version>" (e.g. v3.2.0); the version must match both
# sdk-py/pyproject.toml and sdk-js/package.json or the run fails before publish.
#
# One-time setup (see RELEASING.md):
#   PyPI: configure a Trusted Publisher (OIDC) on the paramant-sdk project, so
#         no token is needed here.
#   npm:  add an automation token as the NPM_TOKEN repository secret. Without it
#         the npm job still runs its version check and tests, then SKIPS the
#         publish with a warning instead of failing, so a missing npm token
#         never blocks the PyPI publish (they are separate jobs).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pypi:
    name: PyPI · paramant-sdk
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC trusted publishing (no stored token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Version matches release tag
        if: github.event_name == 'release'
        working-directory: sdk-py
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${{ github.event.release.tag_name }}"; TAG="${TAG#v}"
          echo "pyproject=$PKG tag=$TAG"
          test "$PKG" = "$TAG"
      - name: Build sdist + wheel
        working-directory: sdk-py
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-py/dist

  publish-npm:
    name: npm · paramant-sdk
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # for npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # A job-level `if:` cannot read `secrets`, so the check lives here and
      # gates the publish step. The version check and the tests run either way:
      # they are the gate that says the tag is coherent, and they cost nothing.
      - name: Is NPM_TOKEN configured?
        id: npm_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Version matches release tag
        if: github.event_name == 'release'
        working-directory: sdk-js
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"; TAG="${TAG#v}"
          echo "package.json=$PKG tag=$TAG"
          test "$PKG" = "$TAG"
      - name: Install + test (gate)
        working-directory: sdk-js
        run: |
          npm install
          npm test
      - name: Publish to npm
        if: steps.npm_token.outputs.present == 'true'
        working-directory: sdk-js
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skipped — no NPM_TOKEN
        if: steps.npm_token.outputs.present != 'true'
        run: |
          VER=$(node -p "require('./sdk-js/package.json').version")
          echo "::warning title=npm publish skipped::NPM_TOKEN is not set on this repository, so paramant-sdk@$VER was NOT published to npm. The PyPI publish is a separate job and was not affected."
          {
            echo "### npm publish skipped"
            echo
            echo "\`paramant-sdk@$VER\` was **not** published to npm: the repository has no"
            echo "\`NPM_TOKEN\` secret, so \`npm publish\` would fail with E401."
            echo
            echo "The build and the test gate ran and passed; only the publish step was skipped,"
            echo "and the PyPI job is unaffected."
            echo
            echo "To publish: Settings, Secrets and variables, Actions, add \`NPM_TOKEN\`"
            echo "(an npm automation token with publish rights to \`paramant-sdk\`), then re-run"
            echo "this workflow with \`workflow_dispatch\`. See RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
